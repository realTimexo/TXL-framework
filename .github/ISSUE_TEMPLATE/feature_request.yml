name: Feature request
description: Suggest a TXL language, compiler, editor, or runtime improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |-
        Describe the user problem first, then a small TXL example showing how you imagine the feature would work.
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - TXL language syntax
        - Compiler or CLI
        - Generated Windows app / WPF runtime
        - VS Code extension
        - Documentation or examples
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      validations:
        required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and example
      description: Include a small TXL example if the proposal changes syntax.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or trade-offs
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this feature.
          required: false
