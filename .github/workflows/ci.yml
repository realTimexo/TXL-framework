name: TXL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.200
      - name: Build solution
        run: dotnet build TXL.slnx --configuration Release
      - name: Run regression suite
        run: dotnet run --project Tests/Txl.Tests/Txl.Tests.csproj --configuration Release --no-build
      - name: Check AllFeatures project
        run: dotnet run --project Compiler/Txl.Cli/Txl.Cli.csproj --configuration Release --no-build -- --check Examples/AllFeatures
