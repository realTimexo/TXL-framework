name: TXL Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $version = (Select-String -Path Compiler/Txl.Cli/Txl.Cli.csproj -Pattern '<PackageVersion>([^<]+)</PackageVersion>').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME must match project package version v$version" }
          $extensionVersion = (Get-Content VSCodeExtension/package.json -Raw | ConvertFrom-Json).version
          if ($extensionVersion -ne $version) { throw "VS Code extension version $extensionVersion must match CLI package version $version" }
      - name: Build and run tests
        run: |
          dotnet build TXL.slnx --configuration Release
          dotnet run --project Tests/Txl.Tests/Txl.Tests.csproj --configuration Release --no-build
      - name: Pack global CLI tool
        run: dotnet pack Compiler/Txl.Cli/Txl.Cli.csproj --configuration Release --output artifacts
      - name: Package VS Code extension
        working-directory: VSCodeExtension
        run: |
          npm ci
          npx vsce package --no-dependencies --out ../artifacts/txl-language-${{ github.ref_name }}.vsix
      - name: Build AllFeatures Windows app
        run: dotnet run --project Compiler/Txl.Cli/Txl.Cli.csproj --configuration Release --no-build -- --build Examples/AllFeatures
      - name: Zip AllFeatures distribution
        shell: pwsh
        run: Compress-Archive -Path Examples/AllFeatures/dist/TXL_All_Features -DestinationPath artifacts/TXL-AllFeatures-${{ github.ref_name }}-win-x64.zip -CompressionLevel Optimal
      - name: Archive AllFeatures source project
        shell: pwsh
        run: git archive --format=zip --prefix=TXL-AllFeatures/ --output=artifacts/TXL-AllFeatures-source-${{ github.ref_name }}.zip $env:GITHUB_REF_NAME Examples/AllFeatures
      - name: Build page navigation example
        run: dotnet run --project Compiler/Txl.Cli/Txl.Cli.csproj --configuration Release --no-build -- --build Examples/PageNavigation
      - name: Package page navigation example
        shell: pwsh
        run: |
          Compress-Archive -Path Examples/PageNavigation/dist/TXL_Page_Navigation_Demo -DestinationPath artifacts/TXL-PageNavigation-${{ github.ref_name }}-win-x64.zip -CompressionLevel Optimal
          git archive --format=zip --prefix=TXL-PageNavigation/ --output=artifacts/TXL-PageNavigation-source-${{ github.ref_name }}.zip $env:GITHUB_REF_NAME Examples/PageNavigation
      - name: Stage versioned PowerShell installer
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: Copy-Item Installer/install.ps1 artifacts/install-txl-${{ github.ref_name }}.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.vsix
            artifacts/*.zip
            artifacts/*.ps1
